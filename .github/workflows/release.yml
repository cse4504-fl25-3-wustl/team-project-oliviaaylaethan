name: Build and Release

on:
  push:
    tags:
      - 'v*' # Triggers on version tags

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: |
            /Users/runner/Library/Caches/Homebrew
            /usr/local/Homebrew
          key: homebrew-${{ runner.os }}-${{ hashFiles('**/Brewfile') }}
          restore-keys: |
            homebrew-${{ runner.os }}-

      - name: Set up C++ tools
        run: |
          brew install cmake
          brew install make
          brew install wxwidgets
          # Add other dependencies if needed

      - name: Build Mac Executable
        run: |
          mkdir build
          cd build
          cmake ..
          cmake --build .

      - name: Upload Mac Executable
        uses: actions/upload-artifact@v4
        with:
          name: mac-executable
          path: build/main  # Replace with actual binary name
          retention-days: 1

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache wxWidgets
        id: cache-wxwidgets
        uses: actions/cache@v4
        with:
          path: C:\wxWidgets-install
          key: wxwidgets-${{ runner.os }}-v3.2.4
          restore-keys: |
            wxwidgets-${{ runner.os }}-

      - name: Ensure Chocolatey is installed
        run: |
          if (-Not (Get-Command choco -ErrorAction SilentlyContinue)) {
            Set-ExecutionPolicy Bypass -Scope Process -Force; \
            [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072; \
            iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
          }

      - name: Install wxWidgets from source
        if: steps.cache-wxwidgets.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v3.2.4 https://github.com/wxWidgets/wxWidgets.git C:\wxWidgets
          cd C:\wxWidgets
          git submodule update --init --recursive --depth 1
          mkdir build-release
          cd build-release
          cmake .. -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DwxBUILD_SHARED=OFF
          cmake --build . --config Release
          cmake --install . --prefix C:\wxWidgets-install

      - name: Build Windows Executable
        run: |
          $env:wxWidgets_ROOT_DIR = "C:\wxWidgets-install"
          mkdir build
          cd build
          cmake -G "Ninja" -DCMAKE_PREFIX_PATH="C:\wxWidgets-install" ..
          cmake --build . --config Release

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: build/Release/main.exe
          retention-days: 1

  create-release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download Mac Executable
        uses: actions/download-artifact@v4
        with:
          name: mac-executable
          path: ./artifacts/mac

      - name: Download Windows Executable
        uses: actions/download-artifact@v4
        with:
          name: windows-executable
          path: ./artifacts/windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
              ./artifacts/mac/*.dmg
              ./artifacts/windows/*.exe
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

