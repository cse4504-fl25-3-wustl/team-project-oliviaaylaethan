name: Build and Release

on:
  push:
    tags:
      - 'v*' # Triggers on version tags

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: |
            /Users/runner/Library/Caches/Homebrew
            /usr/local/Homebrew
          key: homebrew-${{ runner.os }}-${{ hashFiles('**/Brewfile') }}
          restore-keys: |
            homebrew-${{ runner.os }}-

      - name: Set up C++ tools
        run: |
          brew install cmake
          brew install make
          brew install wxwidgets
          # Add other dependencies if needed

      - name: Build Mac Executable
        run: |
          mkdir build
          cd build
          cmake ..
          cmake --build .

      - name: Upload Mac Executable
        uses: actions/upload-artifact@v4
        with:
          name: mac-executable
          path: build/main  # Replace with actual binary name
          retention-days: 1

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache wxWidgets binaries
        id: cache-wxwidgets
        uses: actions/cache@v4
        with:
          path: C:\wxWidgets
          key: wxwidgets-msvc-${{ runner.os }}-v3.3.1
          restore-keys: |
            wxwidgets-msvc-${{ runner.os }}-

      - name: Download and extract wxWidgets MSVC binaries
        if: steps.cache-wxwidgets.outputs.cache-hit != 'true'
        run: |
          $devUrl = "https://github.com/wxWidgets/wxWidgets/releases/download/v3.3.1/wxMSW-3.3.1_vc14x_x64_Dev.7z"

          Invoke-WebRequest -Uri $devUrl -OutFile "wx-dev.7z"
          7z x wx-dev.7z -oC:\wxWidgets
          Remove-Item wx-dev.7z

      - name: Configure + Build (Release, Static)
        run: |
          $env:WXWIN = "C:\wxWidgets"
          mkdir build
          cd build
          cmake -A x64 `
            -DwxWidgets_ROOT_DIR="C:\wxWidgets" `
            -DwxWidgets_LIB_DIR="C:\wxWidgets\lib\vc_x64_lib" `
            -DwxWidgets_USE_STATIC=ON `
            -DwxWidgets_USE_UNICODE=ON `
            -DwxWidgets_USE_NET=ON `
            -DwxWidgets_USE_XML=ON `
            -DwxWidgets_USE_CORE=ON `
            -DwxWidgets_USE_BASE=ON ..
          cmake --build . --config Release

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: build/packingapp.exe
          retention-days: 3


  create-release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download Mac Executable
        uses: actions/download-artifact@v4
        with:
          name: mac-executable
          path: ./artifacts/mac

      - name: Download Windows Executable
        uses: actions/download-artifact@v4
        with:
          name: windows-executable
          path: ./artifacts/windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
              ./artifacts/mac/*.dmg
              ./artifacts/windows/packingapp.exe
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

