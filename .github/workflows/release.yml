name: Build and Release

on:
  push:
    tags:
      - 'v*' # Triggers on version tags

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: |
            /Users/runner/Library/Caches/Homebrew
            /usr/local/Homebrew
          key: homebrew-${{ runner.os }}-${{ hashFiles('**/Brewfile') }}
          restore-keys: |
            homebrew-${{ runner.os }}-

      - name: Set up C++ tools
        run: |
          brew install cmake
          brew install make
          brew install wxwidgets
          # Add other dependencies if needed

      - name: Build Mac Executable
        run: |
          mkdir build
          cd build
          cmake ..
          cmake --build .

      - name: Remove quarantine attribute (unsigned workaround)
        run: |
          cd build
          xattr -cr packingapp.app || true

      - name: Create macOS DMG
        run: |
          cd build
          cpack -G DragNDrop
          # Remove quarantine from DMG as well
          xattr -cr *.dmg || true

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: build/*.dmg
          retention-days: 1

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache wxWidgets binaries
        id: cache-wxwidgets
        uses: actions/cache@v4
        with:
          path: C:\wxWidgets
          key: wxwidgets-mingw-${{ runner.os }}-v3.2.4-gcc1320-x64
          restore-keys: |
            wxwidgets-mingw-${{ runner.os }}-

      - name: Download and extract pre-built wxWidgets (MinGW)
        if: steps.cache-wxwidgets.outputs.cache-hit != 'true'
        run: |
          $url = "https://github.com/wxWidgets/wxWidgets/releases/download/v3.2.4/wxMSW-3.2.4_gcc1320_x64_Dev.7z"
          
          Write-Host "Downloading wxWidgets MinGW static binaries..."
          Invoke-WebRequest -Uri $url -OutFile "wxWidgets-dev.7z"
          
          Write-Host "Extracting files..."
          7z x wxWidgets-dev.7z -oC:\wxWidgets
          
          Write-Host "Downloading wxWidgets headers..."
          $headerUrl = "https://github.com/wxWidgets/wxWidgets/releases/download/v3.2.4/wxWidgets-3.2.4-headers.7z"
          Invoke-WebRequest -Uri $headerUrl -OutFile "wxWidgets-headers.7z"
          7z x wxWidgets-headers.7z -oC:\wxWidgets
          
          Remove-Item wxWidgets-dev.7z, wxWidgets-headers.7z

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build Windows Executable (static)
        run: |
          $env:WXWIN = "C:\wxWidgets"
          $env:wxWidgets_ROOT_DIR = "C:\wxWidgets"
          $env:wxWidgets_LIB_DIR = "C:\wxWidgets\lib\gcc1320_x64_lib"
          
          mkdir build
          cd build
          cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DwxWidgets_ROOT_DIR="C:\wxWidgets" -DwxWidgets_LIB_DIR="C:\wxWidgets\lib\gcc1320_x64_lib" ..
          cmake --build . --config Release

      - name: Create Windows NSIS Installer
        run: |
          $env:wxWidgets_LIB_DIR = "C:\wxWidgets\lib\gcc1320_x64_lib"
          cd build
          cpack -G NSIS

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: build/*.exe
          retention-days: 1

  create-release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: mac-installer
          path: ./artifacts/mac

      - name: Download Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: ./artifacts/windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
              ./artifacts/mac/*.dmg
              ./artifacts/windows/*.exe
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

