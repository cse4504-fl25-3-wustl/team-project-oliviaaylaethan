name: Build and Release

on:
  push:
    tags:
      - 'v*' # Triggers on version tags

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache wxWidgets build
        uses: actions/cache@v4
        with:
          path: build/_deps/wxwidgets-*
          key: wxwidgets-mac-${{ runner.os }}-master-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            wxwidgets-mac-${{ runner.os }}-master-

      - name: Set up C++ tools
        run: |
          brew install cmake
          brew install ninja

      - name: Build Mac Executable
        run: |
          mkdir -p build
          cd build
          cmake ..
          cmake --build .

      - name: Remove quarantine attribute (unsigned workaround)
        run: |
          cd build
          xattr -cr packingapp.app || true

      - name: Create macOS DMG
        run: |
          cd build
          cpack -G DragNDrop
          # Remove quarantine from DMG as well
          xattr -cr *.dmg || true

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: build/*.dmg
          retention-days: 1

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache wxWidgets build
        uses: actions/cache@v4
        with:
          path: build/_deps/wxwidgets-*
          key: wxwidgets-windows-${{ runner.os }}-master-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            wxwidgets-windows-${{ runner.os }}-master-

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build Windows Executable
        run: |
          if (-not (Test-Path build)) { mkdir build }
          cd build
          cmake -A x64 -DCMAKE_BUILD_TYPE=Release ..
          cmake --build . --config Release

      - name: Create Windows NSIS Installer
        run: |
          cd build
          cpack -G NSIS -C Release

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: build/*.exe
          retention-days: 1

  create-release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: mac-installer
          path: ./artifacts/mac

      - name: Download Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: ./artifacts/windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
              ./artifacts/mac/*.dmg
              ./artifacts/windows/*.exe
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

