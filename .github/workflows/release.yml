name: Build and Release

on:
  push:
    tags:
      - 'v*' # Triggers on version tags

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: |
            /Users/runner/Library/Caches/Homebrew
            /usr/local/Homebrew
          key: homebrew-${{ runner.os }}-${{ hashFiles('**/Brewfile') }}
          restore-keys: |
            homebrew-${{ runner.os }}-

      - name: Set up C++ tools
        run: |
          brew install cmake
          brew install make
          brew install wxwidgets
          # Add other dependencies if needed

      - name: Build Mac Executable
        run: |
          mkdir build
          cd build
          cmake ..
          cmake --build .

      - name: Upload Mac Executable
        uses: actions/upload-artifact@v4
        with:
          name: mac-executable
          path: build/main  # Replace with actual binary name
          retention-days: 1

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache wxWidgets binaries
        id: cache-wxwidgets
        uses: actions/cache@v4
        with:
          path: C:\wxWidgets
          key: wxwidgets-prebuilt-${{ runner.os }}-v3.2.4-vc14x-x64
          restore-keys: |
            wxwidgets-prebuilt-${{ runner.os }}-

      - name: Download and extract pre-built wxWidgets
        if: steps.cache-wxwidgets.outputs.cache-hit != 'true'
        run: |
          $url = "https://github.com/wxWidgets/wxWidgets/releases/download/v3.2.4/wxMSW-3.2.4_vc14x_x64_Dev.7z"
          $runtimeUrl = "https://github.com/wxWidgets/wxWidgets/releases/download/v3.2.4/wxMSW-3.2.4_vc14x_x64_ReleaseDLL.7z"
          
          Write-Host "Downloading wxWidgets binaries..."
          Invoke-WebRequest -Uri $url -OutFile "wxWidgets-dev.7z"
          Invoke-WebRequest -Uri $runtimeUrl -OutFile "wxWidgets-runtime.7z"
          
          Write-Host "Extracting files..."
          7z x wxWidgets-dev.7z -oC:\wxWidgets
          7z x wxWidgets-runtime.7z -oC:\wxWidgets
          
          Write-Host "Downloading wxWidgets headers..."
          $headerUrl = "https://github.com/wxWidgets/wxWidgets/releases/download/v3.2.4/wxWidgets-3.2.4-headers.7z"
          Invoke-WebRequest -Uri $headerUrl -OutFile "wxWidgets-headers.7z"
          7z x wxWidgets-headers.7z -oC:\wxWidgets
          
          Remove-Item wxWidgets-dev.7z, wxWidgets-runtime.7z, wxWidgets-headers.7z

      - name: Build Windows Executable
        run: |
          $env:WXWIN = "C:\wxWidgets"
          $env:wxWidgets_ROOT_DIR = "C:\wxWidgets"
          $env:wxWidgets_LIB_DIR = "C:\wxWidgets\lib\vc14x_x64_dll"
          
          mkdir build
          cd build
          cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DwxWidgets_ROOT_DIR="C:\wxWidgets" -DwxWidgets_LIB_DIR="C:\wxWidgets\lib\vc14x_x64_dll" ..
          cmake --build . --config Release

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: build/Release/main.exe
          retention-days: 1

  create-release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download Mac Executable
        uses: actions/download-artifact@v4
        with:
          name: mac-executable
          path: ./artifacts/mac

      - name: Download Windows Executable
        uses: actions/download-artifact@v4
        with:
          name: windows-executable
          path: ./artifacts/windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
              ./artifacts/mac/*.dmg
              ./artifacts/windows/*.exe
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

