name: Build and Release

on:
  push:
    tags:
      - 'v*' # Triggers on version tags

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: |
            /Users/runner/Library/Caches/Homebrew
            /usr/local/Homebrew
          key: homebrew-${{ runner.os }}-${{ hashFiles('**/Brewfile') }}
          restore-keys: |
            homebrew-${{ runner.os }}-

      - name: Set up C++ tools
        run: |
          brew install cmake
          brew install make
          brew install wxwidgets
          # Add other dependencies if needed

      - name: Build Mac Executable
        run: |
          mkdir build
          cd build
          cmake ..
          cmake --build .

      - name: Upload Mac Executable
        uses: actions/upload-artifact@v4
        with:
          name: mac-executable
          path: build/main  # Replace with actual binary name
          retention-days: 1

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache wxWidgets binaries
        id: cache-wxwidgets
        uses: actions/cache@v4
        with:
          path: C:\wxWidgets
          key: wxwidgets-msvc-${{ runner.os }}-v3.3.1
          restore-keys: |
            wxwidgets-msvc-${{ runner.os }}-

      - name: Download and extract wxWidgets MSVC binaries
        if: steps.cache-wxwidgets.outputs.cache-hit != 'true'
        run: |
          $devUrl = "https://github.com/wxWidgets/wxWidgets/releases/download/v3.3.1/wxMSW-3.3.1_vc14x_x64_Dev.7z"
          $runtimeUrl = "https://github.com/wxWidgets/wxWidgets/releases/download/v3.3.1/wxMSW-3.3.1_vc14x_x64_ReleaseDLL.7z"

          Write-Host "Removing any previous wxWidgets folder..."
          if (Test-Path "C:\wxWidgets") { Remove-Item "C:\wxWidgets" -Recurse -Force }

          Write-Host "Downloading wxWidgets binaries..."
          Invoke-WebRequest -Uri $devUrl -OutFile "wx-dev.7z"
          Invoke-WebRequest -Uri $runtimeUrl -OutFile "wx-runtime.7z"

          Write-Host "Extracting wxWidgets binaries..."
          7z x wx-dev.7z -oC:\wxWidgets -y
          7z x wx-runtime.7z -oC:\wxWidgets -y

          Remove-Item wx-dev.7z, wx-runtime.7z

      - name: Configure + Build (Release)
        run: |
          $env:WXWIN = "C:\wxWidgets"
          mkdir build
          cd build
          cmake -A x64 -DwxWidgets_ROOT_DIR="C:\wxWidgets" -DwxWidgets_LIB_DIR="C:\wxWidgets\lib\vc_x64_lib" -DCMAKE_BUILD_TYPE=Release ..
          cmake --build . --config Release

      - name: Copy wxWidgets DLLs into build folder
        run: |
          Copy-Item "C:\wxWidgets\lib\vc_x64_dll\*.dll" -Destination "build" -Force

      - name: Create Windows ZIP package
        run: |
          cd build
          powershell Compress-Archive -Path * -DestinationPath ../windows-package.zip -Force

      - name: Upload Windows Build ZIP
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: windows-package.zip
          retention-days: 3


  create-release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download Mac Executable
        uses: actions/download-artifact@v4
        with:
          name: mac-executable
          path: ./artifacts/mac

      - name: Download Windows Executable
        uses: actions/download-artifact@v4
        with:
          name: windows-executable
          path: ./artifacts/windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
              ./artifacts/mac/*.dmg
              ./artifacts/windows/windows-package.zip
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

